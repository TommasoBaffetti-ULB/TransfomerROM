CAE:
  device: cuda
  lr: 0.00828214765761879
  weight_decay: 0.0011363161966523366
  optimizer: adamw
  use_lookahead: false
  n_epochs: 4
  gradient_clip: -1.0
  saving_folder: training_CAE
  scheduler:
    power: 2
    min_lr: 0.0026702302964439926
    min_lr_warmup: 0.00026702302964439926
    warmup_steps: 13
    warmup_type: linear

Transformer:
  device: cuda
  lr: 1.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  use_lookahead: true
  n_epochs:  4
  gradient_clip: 3
  saving_folder: training_Transformer
  scheduler:
    power: 2
    min_lr: 5.0e-5
    min_lr_warmup: 5.0e-6
    warmup_steps: 15
    warmup_type: linear
  criterion:
    type: MSE
    lambda_t1: 0.5
    lambda_t2: 0.5

ArtFire:
  device: cuda
  lr: 1.0e-6
  weight_decay: 1.0e-3
  optimizer: adamw
  use_lookahead: true
  n_epochs: 4
  gradient_clip: 1
  saving_folder: training_ArtFire
  scheduler:
    power: 2
    min_lr: 5.0e-8
    min_lr_warmup: 5.0e-8
    warmup_steps: 15
    warmup_type: linear
  criterion:
    type: MSE
    lambda_t1: 0.5
    lambda_t2: 0.5
    lambda_data: 0.5
    lambda_mass: 0.5
    phys_channel_start: 5
    phys_channel_end: 13
    phys_target_value: 1.0


